[tools]
kotlin = "latest"
uv = "latest"
"pipx:cisco-ai-skill-scanner" = "latest"

[tools.java]
version = "temurin-25"
postinstall = """
#!/usr/bin/env bash

set -o errexit
set -o nounset

mise_java_version=$MISE_TOOL_VERSION
macos_java_dir=/Library/Java/JavaVirtualMachines/$mise_java_version

sudo mkdir -p $macos_java_dir
sudo ln -sf $XDG_DATA_HOME/mise/installs/java/$mise_java_version/Contents $macos_java_dir/Contents
"""

[tools.node]
version = "lts"
postinstall = """
mkdir -p $XDG_CONFIG_HOME/npm

cat << EOF | sed -E 's/^\\s+//' >| $XDG_CONFIG_HOME/npm/npmrc
  prefix=$XDG_DATA_HOME/npm
  cache=$XDG_CACHE_HOME/npm
  init-module=$XDG_CONFIG_HOME/npm/config/npm-init.js
  logs-dir=$XDG_STATE_HOME/npm/logs
EOF
"""

[tools."npm:skills"]
version = "latest"
depends = "node"
postinstall = """
  skills add herdrdev/herdr --skill herdr --global --yes
"""

[tasks."skills:update"]
description = "update skills installed globally at ~/.agents/skills"
run = "skills update --global"

[tasks."file:inspect"]
description = "lists file attributes"
usage = """
arg <file> help="Name of the file to inspect"
"""
run = "xattr -l {{ usage.file }}"

[tasks."file:trust"]
description = "removes a file from quarantine"
usage = """
arg <file> help="Name of the file to trust"
"""
run = "xattr -d com.apple.quarantine {{ usage.file }}"
