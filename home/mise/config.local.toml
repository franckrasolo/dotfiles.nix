[tools]
kotlin = "latest"
uv = "latest"
"pipx:cisco-ai-skill-scanner" = "latest"

[tools.java]
version = "temurin-25"
postinstall = """
#!/usr/bin/env bash

set -o errexit
set -o nounset

mise_java_version=$MISE_TOOL_VERSION
macos_java_dir=/Library/Java/JavaVirtualMachines/$mise_java_version

sudo mkdir -p $macos_java_dir
sudo ln -sf $XDG_DATA_HOME/mise/installs/java/$mise_java_version/Contents $macos_java_dir/Contents
"""

[tools.node]
version = "lts"
postinstall = """
mkdir -p $XDG_CONFIG_HOME/npm

cat << EOF | sed -E 's/^\\s+//' >| $XDG_CONFIG_HOME/npm/npmrc
  prefix=$XDG_DATA_HOME/npm
  cache=$XDG_CACHE_HOME/npm
  init-module=$XDG_CONFIG_HOME/npm/config/npm-init.js
  logs-dir=$XDG_STATE_HOME/npm/logs
EOF
"""

[tools."npm:skills"]
version = "latest"
depends = "node"
postinstall = """
  skills add herdrdev/herdr --skill herdr --global --yes
"""

[tasks."skills:update"]
description = "update skills installed globally at ~/.agents/skills"
run = "skills update --global"

[tasks."skills:scan-dir"]
description = "Runs a security analysis of a skills directory"
usage = """
arg "<dir>" help="directory containing skills"
flag "--out <path>" help="path of the generated HTML report"
"""
env._.file = "${XDG_CONFIG_HOME}/skill-scanner/openrouter.env"
run = """
  fnox --config ${SKILL_SCANNER_FNOX_CONFIG} exec -- \
    skill-scanner scan-all {{ usage.dir }} \
      --policy ${XDG_CONFIG_HOME}/skill-scanner/scan-policy.yaml \
      --recursive \
      --use-behavioral \
      --use-llm \
      --use-osv \
      --fail-on-severity medium \
      --format summary \
      --format html \
      --output-html {{ usage.out }}
"""
quiet = true

[tasks."skills:scan-repo"]
description = "Runs a security analysis of a skills repository"
usage = """
arg <repo> help="GitHub owner/repo or Git URL of the skills repository"
"""
env._.file = "${XDG_CONFIG_HOME}/skill-scanner/openrouter.env"
run = """
  scan_id="{{ usage.repo | dirname | basename }}:{{ usage.repo | basename }}"
  mkdir -p ${XDG_DATA_HOME}/skill-scanner

  fnox --config ${SKILL_SCANNER_FNOX_CONFIG} exec -- \
    skill-scanner scan-repo {{ usage.repo }} \
      --policy ${XDG_CONFIG_HOME}/skill-scanner/scan-policy.yaml \
      --recursive \
      --use-behavioral \
      --use-llm \
      --use-osv \
      --fail-on-severity medium \
      --format summary \
      --format html \
      --output-html ${XDG_DATA_HOME}/skill-scanner/scan:${scan_id}.html
"""
quiet = true

[tasks."file:inspect"]
description = "lists file attributes"
usage = """
arg <file> help="Name of the file to inspect"
"""
run = "xattr -l {{ usage.file }}"

[tasks."file:trust"]
description = "removes a file from quarantine"
usage = """
arg <file> help="Name of the file to trust"
"""
run = "xattr -d com.apple.quarantine {{ usage.file }}"
