[settings]
env_shell_expand = true
locked = false
lockfile = true

[shell_alias]
aliases = "mise shell-alias ls"
tasks = "mise tasks ls --all --extended"
tools = "mise ls --all-sources"

[tools]
"aqua:steveyegge/beads" = "latest"
fnox = "latest"
"github:Dicklesworthstone/beads_viewer" = "latest"
"github:hmans/beans" = "latest"
"github:remotemobprogramming/mob" = "latest"
"github:zjrosen/perles" = "latest"
opencode = "latest"

[env]
FNOX_AGE_KEY_FILE = "~/dev/dotfiles.nix/home/fnox/age.txt"
