min_version = { hard = "2026.6.5" }

[settings]
env_shell_expand = true
experimental = true
locked = false
lockfile = true
minimum_release_age = "0s"

[settings.npm]
package_manager = "aube"

[shell_alias]
aliases = "mise shell-alias ls"
tasks = "mise tasks ls --all --extended"
tools = "mise ls --all-sources --outdated"

[tools]
"aqua:runkids/skillshare" = "latest"
aube = "latest"
fnox = "latest"
"github:nearai/ironclaw" = "latest"
"github:remotemobprogramming/mob" = "latest"
"github:vladkens/macmon" = "latest"
"github:zeroclaw-labs/zeroclaw" = "latest"
"github:zjrosen/perles" = "latest"
"nix:pkl-lsp" = "latest"
opencode = "latest"
workmux = "latest"
worktrunk = "latest"
television = "latest"

[tools."aqua:gastownhall/beads"]
version = "latest"
postinstall = "ln -sf $(mise which bd) $XDG_BIN_HOME/bd"

[env]
FNOX_AGE_KEY_FILE = "~/dev/dotfiles.nix/home/fnox/age.txt"
FNOX_IF_MISSING = "error"
FNOX_SHELL_OUTPUT = "none"
