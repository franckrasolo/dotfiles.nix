min_version = { hard = "2026.10.7" }

[settings]
env_shell_expand = true
experimental = true
locked = false
lockfile = true
lockfile_platforms = ["macos-arm64"]
minimum_release_age = "0s"
self_update.auto = true

[settings.npm]
package_manager = "aube"

[shell_alias]
aliases = "mise shell-alias ls"
tasks = "mise tasks ls --all --extended"
tools = "mise ls --global --outdated"

[tools]
bun = "latest"
"github:kucherenko/jscpd" = "latest"
"github:remotemobprogramming/mob" = "latest"
"github:vladkens/macmon" = "latest"

[tools.aube]
version = "latest"
postinstall = "aube completion zsh >| $XDG_CACHE_HOME/zsh/completions/_aube.zsh"

[tools."aqua:gastownhall/beads"]
version = "latest"
postinstall = """
  ln -sf $(mise which bd) $XDG_BIN_HOME/bd
  bd completion zsh >| $XDG_CACHE_HOME/zsh/completions/_bd.zsh
"""

[tools."aqua:smol-machines/smolvm"]
version = "latest"
postinstall = "smolvm completion zsh >| $XDG_CACHE_HOME/zsh/completions/_smolvm.zsh"

[tools."github:edden27/dog"]
version = "latest"
postinstall = "dog --generate-completion-script zsh >| $XDG_CACHE_HOME/zsh/completions/_dog.zsh"

[tools.fnox]
version = "latest"
postinstall = "fnox completion zsh >| $XDG_CACHE_HOME/zsh/completions/_fnox.zsh"

[tools."github:rivolink/leaf"]
version = "latest"
postinstall = "leaf --auto-complete zsh:dump >| $XDG_CACHE_HOME/zsh/completions/_leaf.zsh"

[tools."github:zjrosen/perles"]
version = "latest"
postinstall = "perles completion zsh >| $XDG_CACHE_HOME/zsh/completions/_perles.zsh"

[tools."nix:pkl-lsp"]
version = "latest"
postinstall = "pkl shell-completion zsh >| $XDG_CACHE_HOME/zsh/completions/_pkl.zsh"

[tools.television]
version = "latest"
postinstall = "tv completions zsh >| $XDG_CACHE_HOME/zsh/completions/_tv.zsh"

[tools.usage]
version = "latest"
postinstall = "usage --completions zsh >| $XDG_CACHE_HOME/zsh/completions/_usage.zsh"

[tools.worktrunk]
version = "latest"
depends = ["github:can1357/oh-my-pi", "opencode", "pi"]
postinstall = """
  wt config shell init zsh >| $XDG_CACHE_HOME/zsh/completions/_wt.zsh

  wt config plugins omp install --yes
  wt config plugins opencode install --yes
  wt config plugins pi install --yes
"""

[tools.opencode]
version = "latest"
postinstall = """
  ln -sf ${XDG_CONFIG_HOME}/opencode ~/.config/
  opencode completion >| $XDG_CACHE_HOME/zsh/completions/_opencode.zsh

  vendor="${XDG_CONFIG_HOME}/opencode/vendor"
  git sync $vendor https://github.com/f-steff/opencode-env-auth
  git sync $vendor https://github.com/ayghri/i-have-adhd
"""

[tools."github:can1357/oh-my-pi"]
version = "latest"
depends = ["bun"]
postinstall = """
  omp completions zsh >| $XDG_CACHE_HOME/zsh/completions/_omp.zsh

  omp config init-xdg
  omp plugin install --force @ff-labs/pi-fff

  omp plugin marketplace add ayghri/i-have-adhd 2> /dev/null || true
  omp plugin install --force i-have-adhd@i-have-adhd
  omp plugin install --force git:github.com/DietrichGebert/ponytail
  omp plugin install --force github:obra/superpowers
"""

[tools.pi]
version = "latest"
depends = ["node"]
postinstall = """
  pi install npm:@ff-labs/pi-fff

  pi install https://github.com/ayghri/i-have-adhd
  pi install git:github.com/DietrichGebert/ponytail
  pi install git:github.com/obra/superpowers
"""

[tools.herdr]
version = "latest"
depends = ["go", "github:can1357/oh-my-pi", "opencode", "pi"]
postinstall = """
  herdr completions zsh >| $XDG_CACHE_HOME/zsh/completions/_herdr.zsh

  herdr integration install omp
  herdr integration install opencode
  herdr integration install pi

  herdr plugin install crierr/herdr-arrange --yes
"""

[tools."aqua:Gaurav-Gosain/tuios"]
version = "latest"
depends = ["github:can1357/oh-my-pi", "opencode", "pi"]
postinstall = """
  tuios completion zsh >| $XDG_CACHE_HOME/zsh/completions/_tuios.zsh

  tuios integration install opencode
  tuios integration install pi
"""

[tools."github:zeroclaw-labs/zeroclaw"]
version = "latest"
postinstall = "zeroclaw completions zsh >| $XDG_CACHE_HOME/zsh/completions/_zeroclaw.zsh"

[env]
FNOX_AGE_KEY_FILE = "~/dev/dotfiles.nix/home/fnox/age.txt"
FNOX_IF_MISSING = "error"
FNOX_SHELL_OUTPUT = "none"
