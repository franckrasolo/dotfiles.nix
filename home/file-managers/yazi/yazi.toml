[mgr]
ratio = [2, 2, 8]
sort_by = "natural"
sort_sensitive = true

[preview]
max_width = 6000
max_height = 4000

[[plugin.prepend_previewers]]
url = "**/{Opkgfile,PklProject,*.pkl}"
run = 'faster-piper -- tree-sitter highlight --query-paths $XDG_DATA_HOME/tree-sitter/queries/pkl/highlights.scm --scope source.pkl "$1"'
