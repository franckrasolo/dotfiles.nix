include = [
  "appearance.toml",
  "dock.toml",
  "keybindings/config.toml",
  "notifications.toml",
  "miscellaneous.toml",
]

[daemon]
log_level = "off"
agent_detect_seconds = 0
agent_binaries = []
respond_from_shell = false
resume_agents = "ask"
persist_scrollback_lines = 0
persist_scrollback_kb = 0
window_size = "smallest"

[startup]
open_default_window = true
tiled = true
start_in_terminal_mode = true
layout = "bsp"
daemon = true
